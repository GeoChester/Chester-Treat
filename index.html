<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chester's Treat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=IM+Fell+English+SC&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one narrow column at night. Chester peeks over the sign, one keyword field below,
   and the correct keyword raises his Seal of Approval in a purple glow. Single dark look. */
:root{
  --night:#0b0814;   /* page */
  --panel:#150f22;   /* card */
  --edge:#33264a;    /* borders */
  --bone:#efe9d8;    /* text */
  --dim:#9a8fb3;     /* muted */
  --pumpkin:#ff8a1f; /* accent */
  --grin:#8dff7a;    /* Chester's grin */
  --miss:#ff8f7a;    /* wrong keyword */
  --display:'IM Fell English SC',Georgia,serif;
  --body:'Crimson Pro',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
html{background:var(--night)}
body{box-sizing:border-box;min-height:100%;margin:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--night) radial-gradient(ellipse 70% 40% at 50% 0%,#1f1533 0%,rgba(31,21,51,0) 70%);color:var(--bone);font-family:var(--body);font-size:18px;line-height:1.5}
[hidden]{display:none!important}
html,body{overflow-x:clip}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cat{width:84px;height:84px}
h1{margin:0;font:400 clamp(34px,9vw,50px)/1.02 var(--display);letter-spacing:.03em;text-wrap:balance;text-shadow:0 0 18px rgba(255,138,31,.3)}
.lede{margin:0;max-width:26em;color:var(--bone);font-size:clamp(22px,5.6vw,26px);line-height:1.45;text-wrap:pretty}
form{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px}
label{font-family:var(--display);font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:18px;color:var(--bone);background:var(--night);border:1px solid var(--edge);border-radius:8px;padding:9px 11px}
input:focus-visible,button:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px}
.btn{font:inherit;font-size:17px;min-height:44px;padding:6px 22px;border-radius:999px;border:1px solid var(--pumpkin);background:var(--pumpkin);color:#1c0d00;cursor:pointer}
.btn:hover{background:#ffa24a}
form.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.verdict{margin:0;text-align:center;font-size:20px;min-height:1.5em}
.verdict.no{color:var(--miss);font-style:italic}
.verdict.yes{color:var(--grin);text-shadow:0 0 12px rgba(141,255,122,.5)}
.seal{display:flex;flex-direction:column;align-items:center;gap:8px}
.seal img{display:block;width:100%;max-width:520px;height:auto;filter:drop-shadow(0 0 24px rgba(170,80,255,.45));animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:scale(.7) rotate(-8deg);filter:blur(10px) drop-shadow(0 0 0 rgba(170,80,255,0))}to{opacity:1;transform:none}}
.seal p{margin:0;color:var(--dim);font-style:italic;text-align:center}
.seal img.swap{animation:none}
#nameForm{width:100%;box-sizing:border-box}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn.ghost{background:transparent;color:var(--bone)}
.btn.ghost:hover{background:rgba(255,138,31,.12)}
.small{margin:0;font-size:15px;color:var(--dim);font-style:italic;text-align:center;min-height:1.2em}
@media (prefers-reduced-motion:reduce){.seal img,form.shake{animation:none}}
.veil{position:relative;min-height:max(560px,calc(100vh - 170px));border-radius:18px}
.hidden-part{display:flex;flex-direction:column;gap:18px;transition:opacity 2.4s ease,filter 2.4s ease}
.veil.locked .hidden-part{opacity:0;filter:blur(14px);pointer-events:none;user-select:none}
.fog{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:min(100vw,1000px);height:calc(100% + 80px);pointer-events:none;transition:opacity 3s ease}
.veil:not(.locked) .fog{opacity:0}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 8px;transition:opacity 1.6s ease}
.veil:not(.locked) .wait{opacity:0;pointer-events:none}
.veil.quick .hidden-part,.veil.quick .fog,.veil.quick .wait{transition:none}
.clock:not(.ready) b{opacity:.35}
.wk{margin:0;font:400 clamp(32px,8.4vw,46px)/1.05 var(--display);color:var(--bone);text-shadow:0 0 18px rgba(11,8,20,.9),0 0 30px rgba(140,90,220,.5);text-wrap:balance}
.wd{margin:0;font-size:clamp(19px,4.8vw,22px);color:var(--bone);text-shadow:0 0 10px rgba(11,8,20,.95)}
.clock{display:flex;gap:clamp(8px,3vw,16px);margin-top:6px}
.clock span{display:flex;flex-direction:column;align-items:center;min-width:clamp(62px,17vw,84px);padding:10px 6px 8px;border-radius:12px;background:rgba(11,8,20,.62);border:1px solid rgba(154,143,179,.35)}
.clock b{font:500 clamp(32px,9vw,46px)/1 var(--body);font-variant-numeric:tabular-nums;color:var(--pumpkin);text-shadow:0 0 12px rgba(255,138,31,.45)}
.clock i{font-style:normal;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);margin-top:4px}
.wl{margin:0;font-size:16px;color:var(--bone);opacity:.85;text-shadow:0 0 8px rgba(11,8,20,.95);min-height:1.2em}
.admin{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(11,8,20,.88);padding:0 16px}
.acard{width:min(100%,320px);background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.aerr{margin:0;min-height:1.2em;font-size:15px;color:var(--miss);font-style:italic}
@media (prefers-reduced-motion:reduce){.hidden-part,.fog,.wait{transition:none}}

</style>
</head>
<body>

<div class="col">
  <header>
    <svg class="cat" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M46 54c8 0 12-6 10-12-1-4-5-5-7-3" fill="none" stroke="#2a1d3c" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 56c-3-8-2-17 4-23-2-3-3-6-3-10l-2-11 8 7c2-1 4-1 6 0l8-7-2 11c0 4-1 7-3 10 6 6 7 15 4 23z" fill="#2a1d3c" stroke="#8a67b5" stroke-width="1.4" stroke-linejoin="round"/>
      <ellipse cx="27.5" cy="22" rx="2.6" ry="3.2" fill="#8dff7a"/><ellipse cx="36.5" cy="22" rx="2.6" ry="3.2" fill="#8dff7a"/>
      <ellipse cx="27.5" cy="22" rx=".9" ry="2.4" fill="#1a0f24"/><ellipse cx="36.5" cy="22" rx=".9" ry="2.4" fill="#1a0f24"/>
      <path d="M30.5 27l1.5 1.5 1.5-1.5z" fill="#ff7a9a"/>
      <path d="M24 29l-8-1M24 31l-8 2M40 29l8-1M40 31l8 2" stroke="#8a67b5" stroke-width=".9"/>
    </svg>
  </header>
  <div class="veil" id="veil">
  <div class="hidden-part" id="content" inert aria-hidden="true">
  <header>
    <h1>Chester's Treat</h1>
    <p class="lede">Have you SOLVED all Chester's puzzles? The certitude in each puzzle shows a letter - unscramble them and enter the keyphrase, it consists of three words.</p>
  </header>

  <form id="check" autocomplete="off">
    <label for="kw">Keyphrase</label>
    <div class="row">
      <input id="kw" name="kw" type="text" placeholder="Three words" required autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Check</button>
    </div>
  </form>

  <p class="verdict" id="verdict" role="status"></p>

  <section class="seal" id="seal" hidden>
    <img id="sealimg" alt="Chester's Seal of Approval: a grinning purple cat with green eyes in a ring of vines and jack-o'-lanterns. Didn't get tricked, found all the treats!">
    <form id="nameForm" autocomplete="off">
      <label for="who">Put your name on the scroll</label>
      <div class="row">
        <input id="who" name="who" type="text" maxlength="32" placeholder="Your geocaching name" spellcheck="false">
        <button class="btn" type="submit">Add my name</button>
      </div>
    </form>
    <div class="tools"><button class="btn ghost" id="saveSeal" type="button" hidden>Save my seal</button></div>
    <p class="small" id="saveNote">Save or screenshot your seal. You earned it.</p>
  </section>
  </div>
  <canvas class="fog" id="fog" aria-hidden="true"></canvas>
  <div class="wait" id="wait" role="timer" aria-live="off">
    <p class="wk">The fog lifts on Halloween</p>
    <div class="clock" id="clock" aria-label="Time left"><span><b id="tD">–</b><i>days</i></span><span><b id="tH">–</b><i>hours</i></span><span><b id="tM">–</b><i>minutes</i></span><span><b id="tS">–</b><i>seconds</i></span></div>
    <p class="wl" id="wlocal"></p>
  </div>
  </div>
</div>
<div class="admin" id="admin" hidden><div class="acard" role="dialog" aria-modal="true" aria-labelledby="apwl">
  <label id="apwl" for="apw">Password</label>
  <input id="apw" type="password" autocomplete="off">
  <p class="aerr" id="aerr" role="status"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="acancel" type="button">Cancel</button><button class="btn" id="aok" type="button">Open</button></div>
</div></div>

function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function stream(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
let raw=null,url=null;
function tryKey(k){
  if(!raw){const b=atob(SEAL);raw=new Uint8Array(b.length);for(let i=0;i<b.length;i++)raw[i]=b.charCodeAt(i);}
  const nx=stream(fnv('chester-seal|'+k)),head=new Uint8Array(4);
  for(let i=0;i<4;i++)head[i]=raw[i]^nx();
  if(String.fromCharCode.apply(null,head)!=='RIFF')return null;
  const nx2=stream(fnv('chester-seal|'+k)),out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw[i]^nx2();
  return URL.createObjectURL(new Blob([out],{type:'image/webp'}));
}
const form=document.getElementById('check'),verdict=document.getElementById('verdict');
form.addEventListener('submit',function(e){
  e.preventDefault();
  const k=norm(document.getElementById('kw').value);if(!k)return;
  const u=tryKey(k);
  if(!u){
    document.getElementById('seal').hidden=true;
    verdict.className='verdict no';verdict.textContent="Chester squints at you. That's not the keyphrase.";
    form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');return;
  }
  if(url)URL.revokeObjectURL(url);url=u;
  const box=document.getElementById('seal');
  box.hidden=true;base=new Image();
  base.onload=function(){named='';render('').then(function(){box.hidden=false;img.classList.remove('swap');img.style.animation='none';void img.offsetWidth;img.style.animation='';
    box.scrollIntoView({behavior:'smooth',block:'nearest'});});};
  base.src=u;
  verdict.className='verdict yes';verdict.textContent="You didn't get tricked. Chester approves! Now enter the same keyphrase in the certitude on the cachepage and you will be guided to your treat.";
});

/* ---------- the name ribbon ---------- */
const img=document.getElementById('sealimg');
let base=null,named='',outUrl=null,outBlob=null;
const RW=1108,RH=960; // the seal; its parchment scroll spans roughly x 360-760, y 745-850
const SLOGAN="Found all the treats!";
const FONT="'Almendra SC', 'IM Fell English SC', Georgia, serif";
// each line follows the scroll's gentle sag: lower in the middle, rising toward the ends
const LINES={name:{cy:770,sag:15,hw:190,room:330,size:40},slogan:{cy:812,sag:24,hw:200,room:330,size:33}};
function lineY(L,x){const u=(x-RW/2-4)/L.hw;return L.cy+L.sag*(1-u*u);}
function lineSlope(L,x){const u=(x-RW/2-4)/L.hw;return -2*L.sag*u/L.hw;}
function textOnLine(c,txt,L){
  let size=L.size;const sp=()=>size*.03;
  const set=()=>{c.font=size+'px '+FONT;};set();
  const width=()=>{let w=0;for(const ch of txt)w+=c.measureText(ch).width+sp();return w-sp();};
  while(width()>L.room&&size>16){size-=1;set();}
  let x=RW/2+4-width()/2;c.fillStyle='#3a1f12';c.textBaseline='middle';c.textAlign='left';
  for(const ch of txt){const w=c.measureText(ch).width,mid=x+w/2;
    c.save();c.translate(mid,lineY(L,mid));c.rotate(Math.atan(lineSlope(L,mid)));
    c.shadowColor='rgba(255,240,210,.45)';c.shadowOffsetY=1;c.fillText(ch,-w/2,0);c.restore();x+=w+sp();}
}
function render(name){
  const ready=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load("40px 'Almendra SC'"),document.fonts.load("40px 'IM Fell English SC'")]),new Promise(function(r){setTimeout(r,2500);})]).catch(function(){}):Promise.resolve();
  return ready.then(function(){
    const cv=document.createElement('canvas');cv.width=RW;cv.height=RH;const c=cv.getContext('2d');
    c.drawImage(base,0,0,RW,RH);
    if(name)textOnLine(c,name,LINES.name);
    textOnLine(c,SLOGAN,LINES.slogan);
    return new Promise(function(res){cv.toBlob(function(b){outBlob=b;if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(b);img.src=outUrl;
      img.alt="Chester's Seal of Approval: a grinning purple cat with green eyes in a ring of vines and jack-o'-lanterns. The scroll reads "+(name?name+'. ':'')+SLOGAN;res();},'image/png');});
  });
}
document.getElementById('nameForm').addEventListener('submit',function(e){
  e.preventDefault();if(!base)return;
  const name=document.getElementById('who').value.replace(/\s+/g,' ').trim().slice(0,32);
  named=name;img.classList.add('swap');
  render(name).then(function(){document.getElementById('saveNote').textContent=name?'Your seal is ready. Save it or screenshot it.':'Save or screenshot your seal. You earned it.';});
});
/* save: through the viewer's download prompt where it's offered; otherwise screenshot or long-press */
let dl=null;
const plain=!window.claude;
(async function(){if(plain){document.getElementById('saveSeal').hidden=false;return;}try{dl=await window.claude.use('downloads');}catch(e){dl=null;}if(dl)document.getElementById('saveSeal').hidden=false;})();
document.getElementById('saveSeal').addEventListener('click',async function(){
  if((!dl&&!plain)||!outBlob)return;const note=document.getElementById('saveNote');
  const file='Chesters-Seal'+(named?'-'+named.replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,''):'')+'.png';
  if(plain){const a=document.createElement('a');a.href=outUrl;a.download=file;document.body.appendChild(a);a.click();a.remove();note.textContent='Saved. Happy hunting!';return;}
  try{await dl.save({filename:file,data:outBlob});note.textContent='Saved. Happy hunting!';}
  catch(err){const c=err&&err.code;
    if(c==='declined')note.textContent='Not saved. You can still screenshot it.';
    else if(c==='rate_limited')note.textContent='One moment, then try again.';
    else{document.getElementById('saveSeal').hidden=true;note.textContent='Saving isn\'t available here. Screenshot or long-press the seal to keep it.';}}
});
})();

/* ---------- Halloween fog: the treat opens Oct 31, 2026, 8:00 AM Eastern ---------- */
(function(){
  const OPEN=Date.parse('2026-10-31T08:00:00-04:00');
  const veil=document.getElementById('veil'),content=document.getElementById('content'),cv=document.getElementById('fog'),g=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{const fmt={weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'},mine=new Date(OPEN).toLocaleString([],fmt),east=new Date(OPEN).toLocaleString([],Object.assign({timeZone:'America/New_York'},fmt));
    if(mine!==east)document.getElementById('wlocal').textContent='Opens '+mine+' your time.';}catch(e){}
  let locked=true,raf=0,now=function(){return Date.now();};
  // the real time: read from the web server that hosts this page (the Date on its reply), then counted
  // forward with a stopwatch that ignores the device clock. If the server can't be asked, fall back to the device clock.
  function serverClock(){
    const p0=performance.now(),ask=fetch(location.pathname+'?clock='+Date.now().toString(36)+Math.random().toString(36).slice(2),{method:'HEAD',cache:'no-store'})
      .then(function(r){const p1=performance.now(),d=Date.parse(r.headers.get('date')||'');if(isNaN(d))throw 0;
        const age=(+(r.headers.get('age')||0)||0)*1000,base=d+age+(p1-p0)/2;return function(){return base+(performance.now()-p1);};});
    const late=new Promise(function(res){setTimeout(function(){res(null);},6000);});
    return Promise.race([ask,late]).then(function(f){return f||function(){return Date.now();};},function(){return function(){return Date.now();};});
  }

  function lock(on){locked=on;veil.classList.toggle('locked',on);content.inert=on;content.setAttribute('aria-hidden',String(on));if(!on)setTimeout(function(){cancelAnimationFrame(raf);raf=0;},3200);}
  // fog: many soft puffs drifting slowly in two layers, drawn small and scaled up so it stays smooth
  const S=.35;let W=0,H=0,puffs=[];
  function size(){const r=cv.getBoundingClientRect();W=Math.max(1,Math.round(r.width*S));H=Math.max(1,Math.round(r.height*S));cv.width=W;cv.height=H;
    const n=Math.round(W*H/150)+30;puffs=[];for(let i=0;i<n;i++)puffs.push({x:Math.random()*W,y:Math.random()*H,r:(10+Math.random()*24)*(W/180+.4),vx:(Math.random()*.5+.15)*(Math.random()<.5?-1:1),vy:(Math.random()-.5)*.12,a:.08+Math.random()*.2,ph:Math.random()*6,tone:Math.random()});}
  function draw(t){
    g.clearRect(0,0,W,H);
    g.fillStyle='rgba(30,24,46,.97)';g.fillRect(0,0,W,H);
    for(const p of puffs){
      if(!reduce){p.x+=p.vx*.09;p.y+=p.vy*.09+Math.sin(t/4000+p.ph)*.015;}
      if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;if(p.y<-p.r)p.y=H+p.r;if(p.y>H+p.r)p.y=-p.r;
      const pulse=reduce?1:1+.12*Math.sin(t/3000+p.ph),r=p.r*pulse,gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      const c=p.tone<.55?'150,140,175':p.tone<.85?'110,92,150':'200,194,218';
      gr.addColorStop(0,'rgba('+c+','+p.a+')');gr.addColorStop(1,'rgba('+c+',0)');g.fillStyle=gr;g.fillRect(p.x-r,p.y-r,r*2,r*2);}
    // soft edges so the fog melts into the night instead of ending in a box
    g.globalCompositeOperation='destination-in';
    const ex=g.createLinearGradient(0,0,W,0);ex.addColorStop(0,'rgba(0,0,0,0)');ex.addColorStop(.16,'#000');ex.addColorStop(.84,'#000');ex.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=ex;g.fillRect(0,0,W,H);
    const ey=g.createLinearGradient(0,0,0,H);ey.addColorStop(0,'rgba(0,0,0,0)');ey.addColorStop(.14,'#000');ey.addColorStop(.86,'#000');ey.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=ey;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';
  }
  function loop(t){draw(t);raf=requestAnimationFrame(loop);}
  const pad=n=>String(n).padStart(2,'0');
  function tick(){
    const left=OPEN-now();
    if(left<=0){if(locked)lock(false);return;}
    const s=Math.floor(left/1000);
    document.getElementById('tD').textContent=Math.floor(s/86400);document.getElementById('tH').textContent=pad(Math.floor(s/3600)%24);
    document.getElementById('tM').textContent=pad(Math.floor(s/60)%60);document.getElementById('tS').textContent=pad(s%60);
    setTimeout(tick,1000-now()%1000+20);
  }
  // stay fogged until the real time is known, so a wrong device clock never shows the page early
  lock(true);size();raf=requestAnimationFrame(loop);addEventListener('resize',function(){if(locked)size();});
  serverClock().then(function(f){now=f;
    if(now()>=OPEN){veil.classList.add('quick');lock(false);setTimeout(function(){veil.classList.remove('quick');},50);}
    else{document.getElementById('clock').classList.add('ready');tick();}});
  // owner's door: three quick taps on the cat ask for the password; the right one lifts the fog early on this visit only
  const ADMIN=217580182;let taps=[];
  function adminHash(t){let h=2166136261;t="jar-admin|"+t;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  document.querySelector('.cat').addEventListener('pointerdown',function(){const now=performance.now();taps=taps.filter(function(x){return now-x<1500;});taps.push(now);
    if(taps.length>=3&&locked){taps=[];document.getElementById('aerr').textContent='';document.getElementById('apw').value='';document.getElementById('admin').hidden=false;setTimeout(function(){document.getElementById('apw').focus();},0);}});
  function tryAdmin(){if(adminHash(document.getElementById('apw').value)!==ADMIN){document.getElementById('aerr').textContent="That's not it.";document.getElementById('apw').select();return;}
    document.getElementById('admin').hidden=true;lock(false);}
  document.getElementById('aok').addEventListener('click',tryAdmin);
  document.getElementById('acancel').addEventListener('click',function(){document.getElementById('admin').hidden=true;});
  document.getElementById('apw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();tryAdmin();}else if(e.key==='Escape')document.getElementById('admin').hidden=true;});
})();
</script>

</body>
</html>
